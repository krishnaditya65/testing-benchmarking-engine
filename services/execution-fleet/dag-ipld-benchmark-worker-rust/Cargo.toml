[package]
name = "dag-ipld-benchmark-worker-rust"
version = "0.1.0"
edition = "2021"
description = "Execution-fleet worker: IPLD block traversal profiling, cryptographic overhead profiling, and DAG flakiness root-cause isolation."
publish = false

[[bin]]
name = "dag-ipld-benchmark-worker"
path = "src/main.rs"

[dependencies]
# Hashing / signatures / (mock) ZK verification cost profiling.
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
multihash = "0.19"

# Serialization for dispatch payloads / block metadata.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime: concurrent-load harness for the crypto profiler, and the
# eventual Redpanda consumer / OTLP exporter wiring in production.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

rand = "0.8"

# Structured tracing output, matching observability-kit conventions.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive", "env"] }

[package]
name = "wasm-payload-sandbox-runtime"
version = "0.1.0"
edition = "2021"
description = "Execution-fleet worker: wasmtime sandbox host for user-defined pre/post-request scripts, in-sandbox synthetic payload generation, and smart payload fuzzing."
publish = false

[[bin]]
name = "wasm-payload-sandbox-runtime"
path = "src/main.rs"

[dependencies]
# Wasm sandbox: real wasmtime engine/store/linker, fuel metering, WASI deny-by-default.
# wasmtime-wasi's `preview1` compatibility shim lets us host classic `wasm32-wasi`
# guest modules (the common target for lightweight user scripts) without pulling
# guests onto the component model.
wasmtime = "24"
wasmtime-wasi = "24"

# Cheap structural validation of untrusted .wasm bytes before instantiation.
wasmparser = "0.118"

# Payload (de)serialization for generated/fuzzed payloads and dispatch envelopes.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Cryptographically-seeded, reproducible-per-invocation randomness for payload generation.
rand = "0.8"
rand_chacha = "0.3"
uuid = { version = "1", features = ["v4"] }

# Structured tracing output, matching observability-kit conventions.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive", "env"] }

# Blocking HTTP client for the snippet-marketplace registry client stub adapter
# (src/marketplace/snippet_registry_client.rs). Blocking, not async, to match this crate's
# synchronous WasmSandboxHost::execute call shape.
reqwest = { version = "0.12", features = ["blocking", "json"] }

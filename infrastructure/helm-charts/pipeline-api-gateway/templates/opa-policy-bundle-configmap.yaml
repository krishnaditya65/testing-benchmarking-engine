{{- if .Values.opaSidecar.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pipeline-api-gateway.fullname" . }}-opa-policy-bundle
  labels:
    {{- include "pipeline-api-gateway.labels" . | nindent 4 }}
# Embeds the two Rego policy files verbatim from
# services/orchestration-control-plane/pipeline-api-gateway/src/policy-gate/example-policies/
# so the OPA sidecar in deployment.yaml has a real bundle to load via
# `opa run --server -b /policies`. Keep this in sync with example-policies/*.rego —
# there is deliberately no build-time codegen step for this yet, so a change to
# either .rego file must be copied here by hand until that is automated.
data:
  no-chaos-injection-without-approval.rego: |
    # no-chaos-injection-without-approval.rego
    #
    # Policy: a pipeline that contains a CHAOS_INJECTION node targeting anything
    # outside an explicitly pre-approved allowlist of chaos-safe target
    # selectors must not start automatically — it requires a human sign-off via
    # the approval-workflow feature (see ../../approval-workflow/).
    #
    # Rationale: chaos-ebpf-sidecar fault injection (see
    # services/execution-fleet/chaos-ebpf-sidecar) is capable of process kills,
    # CPU starvation, and disk I/O throttling against real infrastructure.
    # Letting *any* pipeline definition trigger that automatically, with no
    # human in the loop, is an unacceptable blast-radius risk — this policy is
    # the guardrail pipeline-api-gateway's PolicyGateService enforces before
    # dag-workflow-scheduler ever sees the run.
    #
    # Loaded (alongside production-namespace-requires-teardown-node.rego) into
    # an OPA sidecar reachable at OPA_SIDECAR_BASE_URL; see the NOTE in
    # ../opa-rego-policy-evaluator.adapter.ts for how that sidecar is expected
    # to be run.
    package testforge.policies
    
    import future.keywords.in
    
    # chaos_safe_target_selectors lists target selectors pre-approved for
    # unattended chaos injection (e.g. dedicated chaos-testing namespaces that
    # are never production-adjacent). Anything else routes through approval.
    chaos_safe_target_selectors := {
    	"namespace=chaos-testing-sandbox",
    	"namespace=perf-lab",
    }
    
    # violations is a partial set every policy file in this package contributes
    # to; opa-rego-policy-evaluator.adapter.ts queries
    # `/v1/data/testforge/policies/violations` once and receives the union of
    # every contributing rule across all loaded .rego files.
    violations contains violation if {
    	some node in input.nodes
    	node.stepType == "ChaosInjection"
    	not node.config.targetSelector in chaos_safe_target_selectors
    
    	violation := {
    		"policy_id": "no-chaos-injection-without-approval",
    		"rule_name": "chaos_injection_requires_approval",
    		"severity": "REQUIRES_APPROVAL",
    		"message": sprintf(
    			"chaos injection node %q targets %q, which is not in the pre-approved chaos-safe selector list; a human must approve this run before it starts",
    			[node.id, node.config.targetSelector],
    		),
    		"node_ids": [node.id],
    	}
    }
  production-namespace-requires-teardown-node.rego: |
    # production-namespace-requires-teardown-node.rego
    #
    # Policy: any pipeline definition that targets a production namespace
    # (input.runContext.targetNamespace matching production_namespace_prefixes)
    # must include at least one ENVIRONMENT_TEARDOWN node. Rationale: a pipeline
    # that provisions or mutates production-adjacent resources (via
    # environment-lifecycle-manager, see
    # services/orchestration-control-plane/environment-lifecycle-manager) but
    # has no teardown node leaves that environment/resources orphaned — this has
    # happened before as a plain authoring mistake (a pipeline author deletes
    # the teardown node while rewiring a branch and doesn't notice), and the
    # blast radius of leaked production-namespace resources is high enough that
    # this is a BLOCKING violation, not merely a warning.
    #
    # Loaded (alongside no-chaos-injection-without-approval.rego) into an OPA
    # sidecar reachable at OPA_SIDECAR_BASE_URL; see the NOTE in
    # ../opa-rego-policy-evaluator.adapter.ts for how that sidecar is expected
    # to be run.
    package testforge.policies
    
    import future.keywords.in
    
    production_namespace_prefixes := {"prod-", "production-"}
    
    is_production_namespace(namespace) if {
    	some prefix in production_namespace_prefixes
    	startswith(namespace, prefix)
    }
    
    has_teardown_node if {
    	some node in input.nodes
    	node.stepType == "EnvironmentTeardown"
    }
    
    # violations is the same shared partial set no-chaos-injection-without-approval.rego
    # contributes to; see that file's header comment for how the two combine.
    violations contains violation if {
    	is_production_namespace(input.runContext.targetNamespace)
    	not has_teardown_node
    
    	violation := {
    		"policy_id": "production-namespace-requires-teardown-node",
    		"rule_name": "production_run_requires_teardown",
    		"severity": "BLOCKING",
    		"message": sprintf(
    			"pipeline %q targets production namespace %q but contains no EnvironmentTeardown node; this run is blocked to prevent orphaned production-adjacent resources",
    			[input.pipelineDefinitionId, input.runContext.targetNamespace],
    		),
    		"node_ids": [],
    	}
    }
{{- end }}

# Production control-plane processes get a larger resource ceiling than
# base defaults because RBAC/test-CRUD query volume and Temporal workflow
# history size both scale with the number of concurrently running pipelines.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-api-gateway
spec:
  template:
    spec:
      containers:
        - name: pipeline-api-gateway
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dag-workflow-scheduler
spec:
  template:
    spec:
      containers:
        - name: dag-workflow-scheduler
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
